<!-- APP SHELL: sidebar + top bar. Pages render into #pages -->
<section id="app" class="hide">
  <aside class="side" id="sidePanel">
    <div class="brand">
      <i><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/></svg></i>
      <div><b id="s-company">Company</b><br><span id="s-tag">ERP</span></div>
    </div>

    <div class="grp">MAIN</div>
    <button class="nav on" data-p="dashboard" onclick="go('dashboard')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</button>
    <button class="nav" data-p="ims" data-perm="ims" onclick="go('ims')">
      <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>IMS</button>

    <button class="nav" disabled style="opacity:.5"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports<span class="soon">soon</span></button>

    <div class="spacer"></div>
    <div class="grp">ACCOUNT</div>
    <button class="nav" data-p="appearance" onclick="go('appearance')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18c-1.5 0-2-1-2-2s1-2 0-3-3 0-4-1 0-2 0-3 2-2 1-3-1-2 0-3 3-1 4-1"/></svg>Appearance</button>
    <button class="nav" data-p="profile" onclick="go('profile')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>Profile</button>
  </aside>

  <!-- ===== Sidebar toggle button ===== -->
  <button class="side-toggle" id="sideToggle" onclick="toggleSidebar()" title="Hide / show menu" aria-label="Toggle sidebar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>

  <main class="main">
    <header class="topbar">
      <h2 id="ttl">Dashboard</h2>
           <div class="tools">
                <button class="icon-btn refresh-btn" id="refreshBtn" onclick="refreshIMS()" title="Refresh data">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 3v6h-6"/>
          </svg>
          <span id="refreshLbl">Last sync: —</span>
          <span id="nextSyncLbl" class="next-sync">Next: —</span>
        </button>
        <div class="seg" title="Text size">
          <button data-f="s" onclick="setFont('s')">A−</button>
          <button data-f="m" onclick="setFont('m')">A</button>
          <button data-f="l" onclick="setFont('l')">A+</button>
        </div>
        <button class="icon-btn" id="modeBtn" onclick="toggleMode()" title="Day / night mode">
          <svg id="ico-moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg>
          <svg id="ico-sun" viewBox="0 0 24 24" class="hide"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
        </button>
        <div class="user">
          <button onclick="toggleMenu()"><div class="av grad" id="av">A</div><div><b id="wname">—</b><span id="wid">—</span></div></button>
          <div class="menu" id="umenu">
            <button onclick="go('profile');toggleMenu()">My profile</button>
            <button onclick="go('appearance');toggleMenu()">Appearance</button>
            <button class="danger" onclick="doLogout()">Log out</button>
          </div>
        </div>
        <button class="logout-btn grad" onclick="doLogout()">Log out</button>
      </div>
    </header>
    <div id="pages"></div>
  </main>
</section>
