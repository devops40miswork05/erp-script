<style>
  /* ===== Theme tokens. Add a theme = one more [data-theme] block + one card in Page_Appearance.html ===== */
  :root{
    --page:#F7F4EE; --card:#FFFFFF; --line:#E6E1D8; --ink:#1C1A17; --muted:#6F6A62; --soft:#F1EDE5;
    --green:#1A8A55; --green-soft:#E3F4EB; --amber:#C7860F; --amber-soft:#FCF1DC; --red:#C4392B; --red-soft:#FBE6E3; --blue:#1F3FA8; --blue-soft:#E6EEFB;
    --b-r:#FDECEA; --b-y:#FFF9DB; --b-g:#E8F5EC; --b-b:#E6EEFB;
    --shadow:0 18px 50px rgba(30,20,10,.12);
  }
  [data-theme="ruby"]  {--a1:#7A0C22;--a2:#C4162F;--a3:#F0642F;--a-soft:#FBE7EA;--side:#3B0812}
  [data-theme="ocean"] {--a1:#0B2E5B;--a2:#1256A6;--a3:#2AA7E8;--a-soft:#E4EFFB;--side:#071C38}
  [data-theme="forest"]{--a1:#0E3D2A;--a2:#1B6B45;--a3:#5DBE7A;--a-soft:#E3F3E8;--side:#082418}
  [data-theme="violet"]{--a1:#2E1466;--a2:#5B2CA6;--a3:#B36BE0;--a-soft:#EFE6FA;--side:#1B0B3F}
  [data-theme="amber"] {--a1:#6B3A05;--a2:#B45309;--a3:#F5A623;--a-soft:#FCEFD8;--side:#3F2203}
  [data-theme="slate"] {--a1:#1F2937;--a2:#374151;--a3:#7C8797;--a-soft:#EAEDF1;--side:#111827}

  [data-mode="dark"]{
    --page:#14161B; --card:#1C1F26; --line:#2B303A; --ink:#ECEEF2; --muted:#9AA1AE; --soft:#242832;
    --green-soft:#153126; --amber-soft:#3A2B0F; --red-soft:#3A1B18; --blue-soft:#182746;
    --b-r:#3A1B18; --b-y:#3A3210; --b-g:#153126; --b-b:#182746; --a-soft:#2A2230; --shadow:0 18px 50px rgba(0,0,0,.5);
  }
  [data-font="s"]{font-size:13px} [data-font="m"]{font-size:14.5px} [data-font="l"]{font-size:16.5px}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:var(--page);font-size:1rem;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
  button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
  input,select{font:inherit;color:inherit}
  .hide{display:none!important}
  .grad{background:linear-gradient(135deg,var(--a2),var(--a3))}

  /* ================= LOGIN ================= */
  #login{min-height:100%;display:grid;grid-template-columns:1.15fr 1fr}
  .hero{position:relative;overflow:hidden;color:#fff;padding:2.6rem 3rem;display:flex;flex-direction:column;justify-content:space-between;
        background:radial-gradient(120% 90% at 20% 20%,var(--a2) 0%,var(--a1) 60%,var(--side) 100%)}
  .hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px);background-size:22px 22px;opacity:.5}
  .orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.45),rgba(255,255,255,.05) 70%);box-shadow:inset -8px -8px 22px rgba(0,0,0,.18);pointer-events:none}
  .ring{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);pointer-events:none}
  .ico{position:absolute;opacity:.28;pointer-events:none}
  .ico svg{width:100%;height:100%;stroke:#fff;fill:none;stroke-width:1.6}
  .hero > .brand,.hero > .hero-copy,.hero > .hero-foot{position:relative;z-index:1}
  .brand{display:flex;align-items:center;gap:.7rem;font-weight:800;font-size:1.05rem}
  .brand i{width:2.3rem;height:2.3rem;border-radius:.7rem;display:grid;place-items:center;background:linear-gradient(135deg,var(--a3),var(--a2));box-shadow:0 8px 20px rgba(0,0,0,.25)}
  .brand i svg{width:1.2rem;height:1.2rem;stroke:#fff;fill:none;stroke-width:2.2}
  .brand small{font-weight:600;font-size:.7rem;letter-spacing:.08em;opacity:.7;margin-left:.6rem}
  .hero-copy{max-width:34rem}
  .pill{display:inline-block;padding:.35rem .8rem;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);font-size:.68rem;letter-spacing:.1em;font-weight:700}
  .hero h1{font-size:clamp(2.4rem,4.2vw,3.6rem);font-weight:800;letter-spacing:-.06em;line-height:1.02;margin:1.1rem 0 1.1rem}
  .hero p{color:rgba(255,255,255,.82);line-height:1.6;max-width:30rem;font-size:.95rem}
  .feat{list-style:none;margin-top:1.4rem;display:grid;gap:.6rem;max-width:30rem}
  .feat li{display:flex;gap:.7rem;align-items:flex-start;color:rgba(255,255,255,.9);font-size:.9rem;line-height:1.45}
  .feat li i{flex:none;width:1.5rem;height:1.5rem;border-radius:.45rem;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;margin-top:.05rem}
  .feat li i svg{width:.85rem;height:.85rem;stroke:#fff;fill:none;stroke-width:2.2}
  .hero-foot{display:flex;align-items:center;gap:.5rem;font-size:.7rem;letter-spacing:.1em;font-weight:700;color:rgba(255,255,255,.75)}
  .hero-foot i{width:.55rem;height:.55rem;border-radius:50%;background:#5DE28C;box-shadow:0 0 12px #5DE28C}
  .form-wrap{display:grid;place-items:center;padding:3rem 2rem;background:var(--page)}
  .card{width:100%;max-width:24rem;background:var(--card);border:1.5px solid var(--line);border-radius:1.1rem;padding:2rem;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--a2),var(--a3))}
  .eyebrow{font-size:.66rem;letter-spacing:.12em;font-weight:800;color:var(--a2)}
  .card h2{font-size:1.5rem;font-weight:800;letter-spacing:-.04em;margin:.4rem 0 .3rem}
  .card .sub{color:var(--muted);font-size:.85rem;margin-bottom:1.4rem}
  label{display:block;font-weight:700;font-size:.68rem;letter-spacing:.08em;color:var(--muted);margin:1rem 0 .4rem}
  .field{position:relative}
  .field svg{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);width:1rem;height:1rem;stroke:var(--muted);fill:none;stroke-width:1.8}
  .in{width:100%;padding:.8rem .9rem .8rem 2.5rem;border:1.5px solid var(--line);border-radius:.7rem;background:var(--soft);outline:0;transition:border .15s}
  .in.plain{padding-left:.9rem}
  .in:focus{border-color:var(--a2);box-shadow:0 0 0 3px var(--a-soft);background:var(--card)}
  .eye{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);padding:.4rem;color:var(--muted)}
  .eye svg{position:static;transform:none;width:1.05rem;height:1.05rem;stroke:currentColor}
  .btn{width:100%;margin-top:1.4rem;padding:.9rem;border-radius:.7rem;color:#fff;font-weight:800;font-size:1rem;box-shadow:0 10px 24px rgba(0,0,0,.18);transition:transform .1s}
  .btn:active{transform:scale(.99)} .btn:disabled{opacity:.6;cursor:wait}
  .link{display:block;text-align:center;margin-top:.9rem;font-size:.8rem;font-weight:700;color:var(--a2)}
  .msg{margin-top:.9rem;padding:.7rem .9rem;border-radius:.6rem;font-weight:600;font-size:.82rem;display:none}
  .msg.err{display:block;background:var(--red-soft);color:var(--red)} .msg.ok{display:block;background:var(--green-soft);color:var(--green)}
  .note{margin-top:1.2rem;color:var(--muted);font-size:.75rem;line-height:1.55}
  .note b{color:var(--ink)}

  /* ================= APP SHELL ================= */
  #app{display:grid;grid-template-columns:10.5rem 1fr;min-height:100%}
  .side{background:var(--side);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:.5rem .4rem;gap:.12rem}
  .side .brand{padding:.3rem .4rem .7rem;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:.3rem;flex-direction:row;align-items:center;gap:.5rem}
  .side .brand b{font-size:.85rem;line-height:1.15}
  .side .brand span{font-size:.65rem;color:rgba(255,255,255,.55);font-weight:600}
  .grp{font-size:.6rem;letter-spacing:.1em;color:rgba(255,255,255,.4);font-weight:800;padding:.5rem .6rem .15rem}
  .nav{width:100%;padding:.38rem .5rem;border-radius:.45rem;color:rgba(255,255,255,.72);display:flex;align-items:center;gap:.45rem;font-size:.76rem;font-weight:600;text-align:left;transition:.15s}
  .nav svg{width:1rem;height:1rem;stroke:currentColor;fill:none;stroke-width:1.9;flex:none}
  .nav:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav.on{background:linear-gradient(90deg,var(--a2),var(--a3));color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25)}
  .nav .soon{margin-left:auto;font-size:.6rem;padding:.15rem .4rem;border-radius:.3rem;background:rgba(255,255,255,.12)}
  .side .spacer{flex:1}
  .main{min-width:0;display:flex;flex-direction:column}
   .topbar{display:flex;align-items:center;justify-content:space-between;gap:.4rem;padding:.1rem .4rem;min-height:1.6rem;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
  .topbar .crumb{color:var(--muted);font-size:.75rem}
  .topbar h2{font-size:.82rem;font-weight:800;letter-spacing:-.02em}
  .tools{display:flex;align-items:center;gap:.4rem}
  .seg{display:flex;border:1px solid var(--line);border-radius:.6rem;overflow:hidden;background:var(--soft)}
  .seg button{padding:.2rem .4rem;font-weight:800;font-size:.68rem;color:var(--muted)}
  .seg button.on{background:var(--card);color:var(--ink)}
  .icon-btn{width:1.5rem;height:1.5rem;border-radius:.5rem;border:1px solid var(--line);background:var(--soft);display:grid;place-items:center;color:var(--ink)}
  .icon-btn svg{width:.95rem;height:.95rem;stroke:currentColor;fill:none;stroke-width:1.9}
  .user{position:relative}
 .user > button{display:flex;align-items:center;gap:.35rem;padding:.1rem .45rem .1rem .1rem;border:1px solid var(--line);border-radius:.5rem;background:var(--soft);line-height:1}
  .av{width:1.25rem;height:1.25rem;border-radius:.4rem;color:#fff;display:grid;place-items:center;font-weight:800;font-size:.75rem}
 .user b{display:block;font-size:.68rem;line-height:1;text-align:left} .user span{font-size:.56rem;color:var(--muted);line-height:1}
  .menu{position:absolute;right:0;top:calc(100% + .4rem);background:var(--card);border:1px solid var(--line);border-radius:.7rem;min-width:11rem;box-shadow:var(--shadow);padding:.35rem;display:none;z-index:9}
  .menu.open{display:block}
  .menu button{width:100%;text-align:left;padding:.6rem .7rem;border-radius:.5rem;font-weight:600;font-size:.85rem}
  .menu button:hover{background:var(--soft)} .menu .danger{color:var(--red)}
 .logout-btn{padding:.25rem .55rem;border-radius:.4rem;color:#fff;font-weight:700;font-size:.7rem}
  .page{padding:.3rem .4rem 2rem;display:none}.page.on{display:block}
  .pagehead{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.1rem;flex-wrap:wrap}
  .pagehead p{color:var(--muted);font-size:.85rem}

  /* ---- components ---- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.9rem;margin-bottom:1.2rem}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:.9rem;padding:1rem 1.2rem;border-left:5px solid var(--a2)}
  .stat.g{border-left-color:var(--green)} .stat.a{border-left-color:var(--amber)} .stat.r{border-left-color:var(--red)}
  .stat .l{font-size:.8rem;color:var(--muted);font-weight:600} .stat .v{font-size:1.9rem;font-weight:800;letter-spacing:-.05em;margin-top:.3rem}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:0;overflow:hidden;margin-bottom:1rem}
  .ph{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.9rem 1.2rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .ph h3{font-size:1rem;font-weight:800}
  .ph .in{width:15rem;padding:.55rem .8rem}
  .chip{padding:.5rem .85rem;border-radius:.55rem;background:var(--soft);font-weight:600;font-size:.78rem;border:1px solid var(--line)}
  .chip.on{background:var(--a-soft);color:var(--a2);border-color:transparent}
  .ghost{padding:.5rem .8rem;border-radius:.55rem;border:1px solid var(--line);font-weight:600;font-size:.78rem}
  .tw{overflow-x:auto}
  .frow th{padding:.4rem .6rem;background:var(--card)}
  .fin{width:100%;min-width:7rem;padding:.45rem .6rem;border:1.5px solid var(--line);border-radius:.45rem;background:var(--soft);font-size:.8rem;outline:0}
  .fin:focus{border-color:var(--a2);background:var(--card)}
 thead{position:static;z-index:1}
  table{width:100%;border-collapse:collapse;min-width:70rem}
  th{text-align:left;font-size:.72rem;color:var(--muted);font-weight:700;padding:.65rem 1rem;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:.7rem 1rem;border-bottom:1px solid var(--line);font-weight:500;vertical-align:middle}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .code{color:var(--muted);font-size:.78rem}
  .tag{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.72rem;font-weight:700}
  .tag.g{background:var(--green-soft);color:var(--green)} .tag.b{background:var(--a-soft);color:var(--a2)}
  .empty{padding:3rem 1.5rem;text-align:center;color:var(--muted);line-height:1.6} .empty b{color:var(--ink);display:block;font-size:1.05rem;margin-bottom:.2rem}
  .loading{padding:2.5rem;text-align:center;color:var(--muted)}
  .legend{display:grid;grid-template-columns:repeat(4,1fr);border-radius:.5rem;overflow:hidden;font-weight:800;font-size:.72rem;text-align:center;flex:none}
  .legend div{padding:.75rem .5rem}
  .ims-head{display:grid;grid-template-columns:1fr auto auto;gap:.9rem;margin-bottom:1rem}
  .kv{background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:.8rem 1rem;display:grid;grid-template-columns:auto 1fr;gap:.25rem 1rem;font-size:.85rem}
  .kv span{color:var(--muted);font-weight:600} .kv b{font-weight:700}
  .party{color:#fff;border-radius:.8rem;padding:.8rem 1.3rem;display:flex;flex-direction:column;justify-content:center}
  .party span{font-size:.72rem;opacity:.8;font-weight:600} .party b{font-size:1.3rem;font-weight:800}
  .sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.7rem;margin-bottom:1rem}
  .sum div{background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:.75rem 1rem}
  .sum span{font-size:.75rem;color:var(--muted);font-weight:600;display:block} .sum b{font-size:1.4rem;font-weight:800;letter-spacing:-.04em}
  tr.b-r td{background:var(--b-r)} tr.b-y td{background:var(--b-y)} tr.b-g td{background:var(--b-g)} tr.b-b td{background:var(--b-b)}
  .pct{display:inline-block;min-width:3.4rem;text-align:center;padding:.25rem .5rem;border-radius:.4rem;font-weight:800;color:#fff;font-size:.75rem}
  .sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:.5rem}
  .sync i{width:.5rem;height:.5rem;border-radius:50%;background:var(--green);display:inline-block}
  .sync.busy i{background:var(--amber);animation:pulse 1s infinite} @keyframes pulse{50%{opacity:.3}}
  .toast{position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--page);padding:.75rem 1.1rem;border-radius:.6rem;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:9}
  .toast.show{opacity:1;transform:translateX(-50%)}

  /* IMS sheet-style page */
  /* .ims-top{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:center;margin-bottom:.8rem} */
  .ims-title{font-size:1.5rem;font-weight:800;color:#E8741E;letter-spacing:-.02em;white-space:nowrap}
  /* .ims-top .legend{margin:0;font-size:.78rem} .ims-top .legend div{padding:.5rem .4rem} */
 .ims-bar{display:flex;flex-wrap:nowrap;gap:.5rem;align-items:center;margin-bottom:.4rem}
  .ims-dates{display:grid;grid-template-columns:auto auto;border:1px solid var(--line);border-radius:.5rem;overflow:hidden;font-size:.8rem}
  .ims-dates div{display:contents} .ims-dates span{background:#3F4A56;color:#fff;font-weight:700;padding:.35rem .7rem;border-bottom:1px solid rgba(255,255,255,.15)}
  .ims-dates b{background:#FFF3D6;color:#333;padding:.35rem .8rem;border-bottom:1px solid var(--line);font-weight:700}
  .ims-days{display:grid;place-items:center;min-width:3.4rem;padding:0 .8rem;background:#FFF3D6;color:#333;border:1px solid var(--line);border-radius:.5rem;font-weight:800}
  .ims-party{display:flex;align-items:stretch;border:2px solid #8B1A1A;border-radius:.5rem;overflow:hidden;font-size:.85rem}
  .ims-party span{background:#8B1A1A;color:#fff;font-weight:800;padding:.4rem .8rem;display:grid;place-items:center}
  .ims-party b{padding:.4rem 1rem;display:grid;place-items:center;font-weight:800;color:#8B1A1A;background:var(--card);min-width:8rem}
  .ims-db{border:1px solid var(--line);border-radius:.5rem;overflow:hidden;font-size:.78rem;text-align:center}
  .ims-db span{display:block;font-weight:800;padding:.3rem .8rem;border-bottom:1px solid var(--line)} .ims-db div{display:flex} .ims-db div b{padding:.3rem .7rem;font-weight:600}
  .ims-db div b+b{border-left:1px solid var(--line)}
  .ims-bar .tools{margin-left:auto} .ims-bar .in{width:13rem;padding:.5rem .8rem}
   table.ims th,table.ims td{padding:.28rem .6rem;font-size:.8rem;border:1px solid #D5D9DF;border-radius:0;line-height:1.1}
  [data-mode="dark"] table.ims th,[data-mode="dark"] table.ims td{border-color:#353B47}
  .ims-grp th{background:#3F4A56;color:#fff;text-align:center;font-weight:800;font-size:.8rem}
  .ims-grp th.t-num{text-align:right;color:#FFE08A} .ims-grp th.t-amt{text-align:right;color:#FFE08A} .ims-grp th.t-red{color:#FF9A9A}
  .ims-hd th{background:#3F4A56;color:#fff;text-align:center;font-weight:800;font-size:.72rem;line-height:1.15;white-space:normal}
  .ims-hd th.i{background:#C9CCD2;color:#8B1A1A} .ims-hd th small{display:block;font-weight:600;font-size:.62rem;opacity:.85}
  .ims-hd th.lead{background:#1F3FA8}
  table.ims td.c-cat,table.ims td.c-code{color:#1F3FA8;font-weight:600} table.ims td.c-name{color:#1F3FA8}
  table.ims td.c-open{background:transparent}
  table.ims td.c-today{background:transparent}
  [data-mode="dark"] table.ims td.c-open{background:transparent}
  table.ims td.ims-pct{text-align:center;font-weight:800} table.ims td.c-lead{font-weight:800}
  @media (max-width:900px){.ims-top{grid-template-columns:1fr}.ims-bar{flex-wrap:wrap}.ims-bar .tools{margin-left:0;width:100%}}

  /* appearance page */
  .themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.8rem}
  .theme{border:2px solid var(--line);border-radius:.9rem;padding:.6rem;background:var(--card);text-align:left;transition:.15s}
  .theme.on{border-color:var(--a2);box-shadow:0 0 0 3px var(--a-soft)}
  .theme .sw{height:3.2rem;border-radius:.6rem;margin-bottom:.5rem}
  .theme b{font-size:.85rem;display:block} .theme span{font-size:.72rem;color:var(--muted)}
  .picker{display:flex;align-items:center;gap:.6rem;padding:.4rem .8rem .4rem .4rem;border:1px solid var(--line);border-radius:.7rem;background:var(--soft);cursor:pointer;font-weight:700;font-size:.85rem}
  .picker input{width:2.4rem;height:2.4rem;border:0;padding:0;background:none;cursor:pointer;border-radius:.5rem}
  .row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0} .row b{display:block;font-size:.9rem} .row p{color:var(--muted);font-size:.8rem;margin-top:.15rem}
  .profile-grid{display:grid;grid-template-columns:auto 1fr;gap:.3rem 1.5rem;padding:1.2rem;font-size:.9rem} .profile-grid span{color:var(--muted);font-weight:600}
  .big-av{width:4.2rem;height:4.2rem;border-radius:1rem;color:#fff;display:grid;place-items:center;font-size:1.8rem;font-weight:800;margin:1.2rem 1.2rem 0}

  /* ---- IMS info cards ---- */
  .ims-cards{display:flex;gap:.6rem;align-items:stretch;flex-wrap:nowrap}
  .imscard{
  display:flex;align-items:center;gap:.55rem;
  padding:.5rem .9rem;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:0;
  white-space:nowrap;
}
  .imscard span{
    font-size:.72rem;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.04em;
  }
  .imscard b{font-size:.88rem;font-weight:800;color:var(--ink)}
  .imscard.accent{background:#8B1A1A;border-color:#8B1A1A}
  .imscard.accent span{color:rgba(255,255,255,.75)}
